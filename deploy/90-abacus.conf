# Abacus host tuning. Install: sudo install -m 0644 deploy/90-abacus.conf /etc/sysctl.d/
# Applied at boot by systemd-sysctl and immediately by: sudo sysctl --system

# Disable RT bandwidth control so SCHED_FIFO works in containers and systemd services
# without per-cgroup cpu.rt_runtime_us budgets. Cost: a runaway FIFO thread owns its core.
kernel.sched_rt_runtime_us = -1

# Move the lockup watchdog off the isolated cores.
kernel.watchdog_cpumask = 0-3

# Reduce memory statistics refresh from every 1 s to every 10 s on every core.
vm.stat_interval = 10
